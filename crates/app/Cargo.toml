[package]
name = "buwiz-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native screens for first-party Buwiz Bot mini apps: the screen definition and the bridge (the `buwiz` global, in Rust)"
# a member of the app's workspace for now; it moves to the SDK repo
# (buwiz-app/buwiz-sdk, `crates/app`), so it depends on nsh only
workspace = "../../app"

[lib]
name = "buwiz_app"
path = "src/lib.rs"

[dependencies]
nsh-core = { path = "../../nsh/crates/nsh-core" }
serde_json = "1"
# the host answers on its own threads; the screen awaits on the engine
# thread (nsh's tasks run inside a tokio context)
tokio = { version = "1", features = ["sync"] }
# `pick_file`'s bytes come base64-encoded, as the TSX bridge's do
base64 = "0.22"

[dev-dependencies]
nsh-engine = { path = "../../nsh/crates/nsh-engine" }
