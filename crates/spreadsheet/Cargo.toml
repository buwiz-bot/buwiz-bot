[package]
name = "buwiz-spreadsheet"
version = "0.1.0"
edition = "2024"
publish = false
description = "The spreadsheet view: .xlsx/.xlsm, .xls, .csv and .tsv opened, edited and saved natively"
workspace = "../../app"

[lib]
name = "buwiz_spreadsheet"
path = "src/lib.rs"

[features]
# The test workbooks (`fixture`), for the app's tests.
testing = []

[dependencies]
buwiz-office-kit = { path = "../office-kit" }
nsh-core = { path = "../../nsh/crates/nsh-core" }
nsh-base = { path = "../../nsh/crates/nsh-base" }
log = "0.4"
serde_json = "1"
# BetterOffice's engine, the one the broker's office tools use, and its
# parse/render layers for a first paint before the full workbook is built;
# office_oxide reads legacy `.xls`.
betteroffice-xlsx = { version = "0.5.1", default-features = false }
xlsx-parse = { package = "betteroffice-xlsx-parse", version = "0.5.1" }
xlsx-render = { package = "betteroffice-xlsx-render", version = "0.5.1" }
ooxml-opc = { package = "betteroffice-opc", version = "0.5.1" }
ooxml-drawingml = { package = "betteroffice-drawingml", version = "0.5.1", features = ["chart"] }
office_oxide = { version = "0.1.16", default-features = false }

[dev-dependencies]
buwiz-office-kit = { path = "../office-kit", features = ["testing"] }
