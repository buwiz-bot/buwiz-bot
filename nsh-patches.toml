# The nsh changes Buwiz Bot carries: one entry per topic branch on hexuria/nsh.
# `buwiz` = `main` + every topic whose status is local, open or buwiz-only, in
# this order. How to use it: NSH-FORK.md. `scripts/nsh-fork status` checks it.
#
# status: local    on the fork only, no upstream PR yet
#         open     PR open on longbridge/nsh
#         merged   upstream has it: dropped at the next rebuild
#         buwiz-only upstream declined it (say why in `note`); carried for good
#         parked   kept as a branch, left out of `buwiz` (say why in `note`)

