[package]
name = "buwiz-protocol"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Mini App Protocol v1 pieces shared by the Buwiz Bot app and buwiz-broker: JCS, ed25519 keys, id grammars, tokens"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = "0.2"
# a mini app setup field's shape check (`setup`), the broker's and the app's
regex-lite = "0.1"
rusqlite = "0.32"
serde = "1"
serde_json = "1"
sha2 = "0.10"
