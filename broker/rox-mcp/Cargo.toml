[package]
name = "rox-mcp"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "The stdio MCP client rox-broker hosts plugins with (buwiz-gws, in buwiz-app/google-workspace, keeps a copy for its upstream)"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
