[package]
name = "rox-broker"
version = "0.1.0"
edition = "2021"
description = "The Rox broker: the front door on the broker's port, with the Node broker behind it until each route moves to Rust"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
libc = "0.2"
regex-lite = "0.1"
rox-v1 = { path = "../rox-v1" }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
webpki-roots = "1"
