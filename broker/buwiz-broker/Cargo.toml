[package]
name = "buwiz-broker"
version = "0.1.5"
license = "Apache-2.0"
edition = "2021"
description = "The Buwiz Bot broker: the front door on the broker's port, with the Node broker behind it until each route moves to Rust"
publish = false

[features]
# Test Bots only: BUWIZ_TEST_GOOGLE points account sign-in at a stub Google on
# loopback. A release is built without it, and the variable does nothing.
test-google = []

[dependencies]
async-trait = "0.1"
# office in Rust (plan 6.1): BetterOffice's engines, the crates its npm
# packages are built from
betteroffice-docx = "0.5.1"
betteroffice-xlsx = "0.5.1"
betteroffice-pptx = "0.5.1"
# the engines' own layers the agent port drives directly (all already in
# the facades' tree, so nothing new is fetched): the docx editing core and
# package writer, the pptx editing session, and the OPC zip
docx-edit = { package = "betteroffice-docx-edit", version = "0.5.1" }
docx-parse = { package = "betteroffice-docx-parse", version = "0.5.1" }
pptx-edit = { package = "betteroffice-pptx-edit", version = "0.5.1" }
ooxml-opc = { package = "betteroffice-opc", version = "0.5.1" }
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2.2"
fancy-regex = "0.16"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
libc = "0.2"
regex-lite = "0.1"
buwiz-computer = { path = "../buwiz-computer" }
buwiz-mcp = { path = "../buwiz-mcp" }
buwiz-protocol = { path = "../buwiz-protocol" }
# The Agent Hub's messages (`hub/tools/ui.rs`), shared with the Bot.
buwiz-agent = { git = "https://github.com/buwiz-app/buwiz-agent", rev = "0610474fbf4e3e13bcfae1b1cb42137a09e74466" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
# /file/render's code lines (plan 7): TextMate grammars like Shiki's, pure
# Rust regexes, Grok's themes as tmTheme files (hub/render/)
syntect = { version = "5.3", default-features = false, features = ["parsing", "plist-load", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
buwiz-computer = { path = "../buwiz-computer", features = ["mock"] }
# a box's tunnel WebSocket on loopback, for the tunnel client's tests (already in the tree, through
# buwiz-computer's box-egress)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
