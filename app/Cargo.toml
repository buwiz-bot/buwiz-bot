[package]
name = "rox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = { path = "../nsh/crates/nsh-core" }
nsh-base = { path = "../nsh/crates/nsh-base" }
nsh-engine = { path = "../nsh/crates/nsh-engine" }
nsh-bundler = { path = "../nsh/crates/nsh-bundler", default-features = false }
ra-jit-live = { path = "../blaze/crates/ra-jit-live" }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
serde = "1"
# Mini App Protocol v1: session keys and signed calls (JCS + ed25519),
# fingerprints, base64url. Versions already in the lockfile.
ed25519-dalek = "2.2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# the protocol pieces shared with the broker (JCS, keys, ids, tokens)
rox-v1 = { path = "../broker/rox-v1" }
# Settings › Logins' `site_logins` metadata table (the system SQLite; no
# secret column — secrets are in the Keychain).
rusqlite = "0.32"
# ```mermaid fences: Pele (the Mermaid renderer) ported to Rust, drawn natively.
pele = { git = "https://github.com/hexuria/pele-rs", rev = "9af923e41c031b8c7644940685afc201df4f340f" }
# Office files in native views (`office/` routes them): the shared kit,
# Word and the spreadsheet, as library crates (`crates/`).
buwiz-office-kit = { path = "../crates/office-kit" }
buwiz-word = { path = "../crates/word" }
buwiz-spreadsheet = { path = "../crates/spreadsheet" }
# the office worker's events reach the UI task through a tokio channel
# (nsh's tasks run inside a tokio context)
tokio = { version = "1", features = ["sync"] }
# First-party mini apps' native screens: the screen definition and the
# bridge a screen gets (moves to the SDK repo, buwiz-app/buwiz-sdk).
buwiz-app = { path = "../crates/app" }

[dev-dependencies]
# pele::corpus: the port's test inputs, to check the drawing of every one.
pele = { git = "https://github.com/hexuria/pele-rs", rev = "9af923e41c031b8c7644940685afc201df4f340f", features = ["corpus"] }
# The office crates' headless driver and test documents, and the engines
# that read the saved files back (`office/ui_tests.rs`).
buwiz-office-kit = { path = "../crates/office-kit", features = ["testing"] }
buwiz-word = { path = "../crates/word", features = ["testing"] }
buwiz-spreadsheet = { path = "../crates/spreadsheet", features = ["testing"] }
betteroffice-xlsx = { version = "0.5.1", default-features = false }
betteroffice-docx = { version = "0.5.1", default-features = false }
xlsx-render = { package = "betteroffice-xlsx-render", version = "0.5.1" }
ooxml-opc = { package = "betteroffice-opc", version = "0.5.1" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { path = "../nsh/crates/nsh-platform-macos", default-features = false, features = ["gpui-agent"] }
# The same AppKit crate nsh uses, with the print classes (the file viewer's
# Print); features merge into nsh's copy.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPrintOperation", "NSPrintInfo", "NSImageView", "NSControl", "NSImage", "NSView", "NSResponder", "NSText", "NSTextView", "NSFont"] }
# Saved site logins' secrets: Keychain generic passwords (`vault/keychain.rs`).
security-framework = "3.7"
# A v1 mini app's bridge answers from the main thread (file dialog,
# pasteboard, the full-screen stack).
dispatch2 = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { path = "../nsh/crates/nsh-platform-ios", default-features = false }
nsh-ios-app = { path = "../nsh/crates/nsh-ios-app", default-features = false }

# The office crates build with the app: one lockfile and target dir.
[workspace]
members = ["../crates/office-kit", "../crates/word", "../crates/spreadsheet", "../crates/app"]

# A binary per supported host target; the library is what the iOS runner and
# nsh's generated workspace link.
[lib]
name = "rox"
path = "src/lib.rs"

# Dependencies at full speed in dev builds — only `rox` itself stays a
# debug build (ra-jit patches it). nsh's own workspace sets these per hot
# crate (QuickJS, taffy, objc2, …), but profiles only apply from the root
# manifest, so rox ran them unoptimized. `debug-assertions = false` also
# turns off objc2's per-message signature verification, which took about
# two thirds of the main thread while switching chats.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
