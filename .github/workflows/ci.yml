name: CI

# The app's, the office crates' and the broker's tests, and clippy on the
# app and the office crates, on Apple silicon, and that nsh's Cargo.lock
# passes --locked, for every PR.
#
# main runs too, and only main saves caches: a PR can read its base branch's
# cache but no other PR's, and caches saved by PRs push each other out.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # the release builds nsh (nsh-cli, nsh-macos-host) with --locked: a buwiz
  # whose Cargo.lock lacks what its merged topics added fails here, not at
  # release time
  nsh-lock:
    name: nsh Cargo.lock (cargo metadata --locked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check
        working-directory: nsh
        # stable: resolving needs none of nsh's toolchain file's mobile targets
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo metadata --locked --format-version 1 > /dev/null
  app:
    name: App and office crates (cargo test)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the office crates' tests draw and measure with @betteroffice/fonts,
      # which they find in server/node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: npm ci (server)
        working-directory: server
        run: npm ci
      # rustup installs app/rust-toolchain.toml's 1.99.0 on first use
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: app
      - name: Test
        working-directory: app
        run: cargo test --locked -p buwiz-bot -p buwiz-office-kit -p buwiz-word -p buwiz-spreadsheet

  clippy:
    name: App and office crates (cargo clippy)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # rustup installs app/rust-toolchain.toml's 1.99.0 on first use
      - name: Add clippy
        working-directory: app
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: app
          key: clippy
      - name: Clippy
        working-directory: app
        run: cargo clippy --all-targets --locked -p buwiz-bot -p buwiz-office-kit -p buwiz-word -p buwiz-spreadsheet -- -D warnings 2>&1

  broker:
    name: Broker (cargo test)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the broker's diff tests run server/'s Node code beside it
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: npm ci (server)
        working-directory: server
        run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: broker
      - name: Test
        working-directory: broker
        run: cargo test --locked
      # the stub sign-in of a test-google broker, which only a harness that
      # asks for that feature builds; a plain broker refuses BUWIZ_TEST_GOOGLE
      - name: Test (test-google)
        working-directory: broker
        run: cargo test --locked -p buwiz-broker --features test-google --lib -- accounts
      - name: Test (the test Bot launcher)
        run: scripts/test-buwiz-test
