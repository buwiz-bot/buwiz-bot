name: CI

# The app's, the office crates' and the broker's tests on Apple silicon,
# for every PR.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App and office crates (cargo test)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the office crates' tests draw and measure with @betteroffice/fonts,
      # which they find in server/node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: npm ci (server)
        working-directory: server
        run: npm ci
      # rustup installs app/rust-toolchain.toml's 1.99.0 on first use
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Test
        working-directory: app
        run: cargo test --locked -p rox -p buwiz-office-kit -p buwiz-word -p buwiz-spreadsheet

  broker:
    name: Broker (cargo test)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # the broker's diff tests run server/'s Node code beside it
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: npm ci (server)
        working-directory: server
        run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: broker
      - name: Test
        working-directory: broker
        run: cargo test --locked
