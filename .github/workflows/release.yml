name: Release

# Builds Buwiz Bot, publishes a GitHub release and uploads to Cloudflare R2.
# `just publish` (scripts/release/publish.sh) is what starts it, from the
# version's tag: no push, PR or merge does. docs/release.md has the rest.
#
# A secret left unset degrades, it doesn't fail:
#   no signing secrets  an unsigned dmg, a GitHub pre-release, nothing on R2
#   no R2 secrets       a GitHub release, nothing on R2
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (MAJOR.MINOR.PATCH); run this from its tag, v<version>
        required: true
        type: string
      replace:
        description: Replace an existing release of this version
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time, and never cancel a run that may be signing,
# notarizing or uploading
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}
  REPLACE: ${{ inputs.replace }}

jobs:
  # Everything that can be refused is refused here, before the long build.
  preflight:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      r2: ${{ steps.r2.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag and the Cargo versions agree
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH, not '$VERSION'" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "a release runs from its tag, v$VERSION, not $GITHUB_REF: use just publish" >&2
            exit 1
          fi
          for toml in app/Cargo.toml broker/buwiz-broker/Cargo.toml; do
            found="$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^version *=/{print $2; exit}' "$toml")"
            if [ "$found" != "$VERSION" ]; then
              echo "tag v$VERSION does not match $toml's version $found" >&2
              exit 1
            fi
          done

      - name: Nothing is overwritten unless asked
        if: inputs.replace != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; 'just publish $VERSION' replaces it" >&2
            exit 1
          fi

      - name: R2 secrets
        id: r2
        shell: bash
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::missing$missing: this release skips R2, so buwiz.com will not offer it"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            # release-file-{platform}-{arch}-{kind}: manifest.py reads this
            artifact: release-file-macos-arm64-dmg
            files: dist/*.dmg
          # Switched off: the Bot doesn't run on these yet, so there is nothing
          # to ship. app/src/main.rs's main only exits there, app/Cargo.toml
          # takes no nsh Linux or Windows backend, and the office crates and
          # the Agent Hub are macOS-only (docs/release.md, "Targets"). Turning
          # one on takes that port, then packaging steps here: every step
          # below is macOS's.
          # - target: linux-x64
          #   runner: ubuntu-24.04
          #   artifact: release-file-linux-x64-deb
          #   files: dist/*.deb
          # - target: windows-x64
          #   runner: windows-2025
          #   artifact: release-file-windows-x64-exe
          #   files: dist/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Signing inputs
        id: inputs
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          missing=""
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_ID NOTARY_ISSUER_ID NOTARY_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::missing$missing: this build is signed ad hoc, not notarized; it goes out as a GitHub pre-release and not to R2"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Office editor and fonts (server/)
        working-directory: server
        run: |
          npm ci
          npm run build:office-editor

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            broker
            nsh

      - name: Build the release bundle
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/release/build.sh

      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          (umask 077 && printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          IDS="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep '"Developer ID Application:' || true)"
          if [ "$(printf '%s\n' "$IDS" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one Developer ID Application identity in MACOS_CERT_P12:" >&2
            printf '%s\n' "$IDS" >&2
            exit 1
          fi
          NAME="$(printf '%s\n' "$IDS" | sed -E 's/.*"(.*)".*/\1/')"
          if [ -n "$DEVELOPER_ID_APPLICATION" ] && [ "$NAME" != "$DEVELOPER_ID_APPLICATION" ]; then
            echo "the certificate is \"$NAME\", not DEVELOPER_ID_APPLICATION \"$DEVELOPER_ID_APPLICATION\"" >&2
            exit 1
          fi
          echo "DEVELOPER_ID_APPLICATION=$NAME" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple the app
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          REQUIRE_NOTARIZATION: '1'
        run: |
          scripts/release/sign.sh
          scripts/release/notarize.sh dist/*.app

      - name: Sign ad hoc (dry run)
        if: steps.inputs.outputs.signed != 'true'
        run: scripts/release/sign.sh -

      - name: Make, sign, notarize and staple the dmg
        shell: bash
        env:
          SIGNED: ${{ steps.inputs.outputs.signed }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          REQUIRE_NOTARIZATION: '1'
        run: |
          if [ "$SIGNED" = true ]; then
            scripts/release/dmg.sh
          else
            scripts/release/dmg.sh -
          fi

      - name: The built app is this version
        shell: bash
        run: |
          built="$(plutil -extract CFBundleShortVersionString raw -o - dist/*.app/Contents/Info.plist)"
          if [ "$built" != "$VERSION" ]; then
            echo "the app says $built, the tag v$VERSION" >&2
            exit 1
          fi

      - name: Gatekeeper check
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        run: |
          spctl -a -vvv -t exec dist/*.app
          spctl -a -vvv -t open --context context:primary-signature dist/*.dmg
          xcrun stapler validate dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ matrix.files }}

      - name: Note whether it was signed
        shell: bash
        env:
          SIGNED: ${{ steps.inputs.outputs.signed }}
        run: |
          mkdir -p status
          echo "$SIGNED" > status/signed

      - uses: actions/upload-artifact@v4
        with:
          name: release-status-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: status/signed

      - name: Remove the signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  # The only job that writes anywhere, and only once every target has built:
  # a failed build leaves what is published as it was.
  publish:
    name: Publish
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      R2_READY: ${{ needs.preflight.outputs.r2 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-file-*
          path: files

      - uses: actions/download-artifact@v4
        with:
          pattern: release-status-*
          path: status

      - name: Manifest and checksums
        run: python3 scripts/release/manifest.py files "$VERSION" out

      - name: Was every target signed
        id: state
        shell: bash
        run: |
          if grep -rqvx true status; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to R2
        if: steps.state.outputs.signed == 'true' && needs.preflight.outputs.r2 == 'true'
        env:
          R2_BUCKET: buwiz-releases
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: scripts/release/r2-publish.sh files out

      - name: GitHub release
        shell: bash
        env:
          SIGNED: ${{ steps.state.outputs.signed }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ARGS=(--verify-tag --title "Buwiz Bot $VERSION" --generate-notes)
          if [ "$SIGNED" != true ]; then
            ARGS+=(--prerelease --notes "Unsigned build: macOS blocks it until you allow it in System Settings.")
          fi
          if [ "$REPLACE" = true ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" "${ARGS[@]}" files/release-file-*/* out/manifest.json out/SHA256SUMS

      - name: Summary
        if: always()
        shell: bash
        env:
          SIGNED: ${{ steps.state.outputs.signed }}
        run: |
          {
            echo "### Buwiz Bot $VERSION"
            echo
            if [ "$SIGNED" = true ]; then
              echo "- Signed and notarized."
            else
              echo "- **Not signed.** A GitHub pre-release only; add the signing secrets and run \`just publish $VERSION\`."
            fi
            if [ "$SIGNED" = true ] && [ "$R2_READY" = true ]; then
              echo "- On R2 under \`bot/releases/v$VERSION/\`."
            else
              echo "- **Not on R2**, so buwiz.com doesn't offer it."
            fi
            if [ -f out/SHA256SUMS ]; then
              echo
              echo '```'
              cat out/SHA256SUMS
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
